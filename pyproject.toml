[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senku"
version = "0.1.0"
description = "Senku: a self-supervised world model with a global latent and state tokens, for planning from pixels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "numpy",
    "h5py",
    "hdf5plugin",
    "scikit-learn",
    "scipy",
    "stable-worldmodel==0.1.0",
    "stable-pretraining==0.1.7",
    "transformers==5.7.0",   # LeWM's ViT; later 5.x renames its layers and LeWM's checkpoints fail to load
    "ogbench==1.2.1",
    "mujoco>=3.2",
    "gymnasium>=1.0",
    "pygame>=2.5",
    "pymunk>=7,<8",
    "shapely>=2",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["senku*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
